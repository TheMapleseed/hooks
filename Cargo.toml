[package]
name = "hooks"
version = "0.3.0"
edition = "2024"
description = "Swiss-army-knife HTTP webhook crate: typed builders, signed delivery, and provider registration"
license = "MIT OR Apache-2.0"
readme = "README.md"
repository = "https://github.com/TheMapleseed/Hooks"
keywords = ["webhooks", "hooks", "stripe", "github", "delivery"]
categories = ["development-tools", "config", "web-programming"]

[dependencies]
base64 = "0.22"
hex = "0.4"
hmac = "0.12"
kdl = "6"
regex = "1"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls"] }
secrecy = "0.10"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha1 = "0.10"
sha2 = "0.10"
thiserror = "2"
time = { version = "0.3", features = ["formatting", "macros"] }
uuid = { version = "1", features = ["v4"] }
zeroize = { version = "1", features = ["derive"] }

[dev-dependencies]
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
wiremock = "0.6"
